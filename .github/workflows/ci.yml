name: CI

# fmt, clippy, and tests of the workspace on Linux, macOS, and Windows, plus the
# repository checks. Every check goes through scripts/check.sh, so CI, the git
# hooks, and local runs use the same commands. Jobs are listed in
# docs/dev-guide/ci.md.

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

permissions:
  contents: read

# Pushes and manual runs get one group per branch and commit, so pushes of
# different commits each keep their own run. A push and a manual run of the same
# ref and commit share a group: a run that is still waiting there can be
# cancelled by a newer request for the same ref and commit. Pull requests share
# one group per pull request, and a new commit cancels the run of the older one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Use only the toolchain the job installs from rust-toolchain.toml.
  RUSTUP_AUTO_INSTALL: "0"

defaults:
  run:
    # Git Bash on the Windows runners.
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      - name: fmt
        run: scripts/check.sh fmt

  clippy-test:
    name: clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      - name: clippy
        run: scripts/check.sh lint
      # The SSH integration tests (crates/tasty-net-demo/tests/ssh_attach.rs) log in
      # with the system ssh to an OpenSSH sshd they start themselves, or to a
      # test-only Rust SSH server when that sshd cannot serve; with neither they fail
      # (docs/design/testing.md). The next three steps only install and report sshd.
      # A failed install does not fail the job: the tests then use the fallback.
      - name: Install OpenSSH server (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q openssh-server
          fi
      - name: Install OpenSSH server (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $sshd = Join-Path $env:WINDIR 'System32\OpenSSH\sshd.exe'
          if (-not (Test-Path $sshd)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-String | Write-Host
          }
      - name: Check sshd for the SSH tests
        run: bash scripts/prepare-test-sshd.sh
      # The ssh -G comparison of tasty-net-ssh-config (tests/matches_openssh.rs) uses
      # a reference client built from the OpenSSH commit the port follows
      # (docs/design/ssh-backends.md). The build is cached; the test step requires the
      # client on Linux and macOS. Windows does not compare.
      - name: Cache OpenSSH reference client
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools/openssh-10.6p2
          key: openssh-ref-d449e662-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-openssh-ref.sh') }}
      - name: Build OpenSSH reference client (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # A cached client that no longer runs (a newer runner image) is rebuilt.
          if ! target/tools/openssh-10.6p2/bin/ssh -V 2>&1 | grep -q '^OpenSSH_10\.6p2'; then
            sudo apt-get update -q
            sudo apt-get install -y -q autoconf build-essential libssl-dev zlib1g-dev libkrb5-dev
          fi
          bash scripts/install-openssh-ref.sh
      - name: Build OpenSSH reference client (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          if ! target/tools/openssh-10.6p2/bin/ssh -V 2>&1 | grep -q '^OpenSSH_10\.6p2'; then
            brew install autoconf automake openssl@3
          fi
          OPENSSH_CONFIGURE_EXTRA="--with-ssl-dir=$(brew --prefix openssl@3)" bash scripts/install-openssh-ref.sh
      - name: test
        env:
          TASTY_OPENSSH_REF_REQUIRED: ${{ runner.os != 'Windows' && '1' || '' }}
        run: scripts/check.sh test --no-fail-fast
      # Criterion E1 of docs/design/done-criteria.md: both SSH backends built. The
      # demo's _embedded attach tests start the dialer with no OpenSSH client on its
      # PATH, so auto falls back to the embedded backend (docs/design/ssh-backends.md
      # "시험 목록").
      - name: clippy, both SSH backends
        run: cargo clippy --workspace --all-targets --locked --features tasty-net-ssh/embedded-ssh,tasty-net-transport/embedded-ssh,tasty-net-demo/embedded-ssh -- -D warnings
      - name: test, both SSH backends (E1)
        run: cargo test --locked -p tasty-net-ssh -p tasty-net-transport -p tasty-net-demo --features tasty-net-ssh/embedded-ssh,tasty-net-transport/embedded-ssh,tasty-net-demo/embedded-ssh --no-fail-fast
      # The mobile combination: the embedded backend without the system one.
      - name: embedded SSH backend alone
        run: |
          cargo clippy --locked -p tasty-net-ssh -p tasty-net-transport --all-targets --no-default-features --features tasty-net-ssh/embedded-ssh,tasty-net-transport/embedded-ssh -- -D warnings
          cargo test --locked -p tasty-net-ssh -p tasty-net-transport --no-default-features --features tasty-net-ssh/embedded-ssh,tasty-net-transport/embedded-ssh --no-fail-fast
      # The SSH feature contract (docs/design/ssh-backends.md): tasty-net-transport
      # builds, passes clippy and its tests without default features, and that build
      # has no tasty-net-ssh in its dependency graph.
      - name: transport without ssh
        run: scripts/check.sh transport-no-ssh
      # Criterion D8 of docs/design/done-criteria.md: the P2P crates pass their tests
      # built alone, without the features other workspace members turn on.
      - name: test tasty-net-rendezvous alone
        run: cargo test -p tasty-net-rendezvous --locked
      - name: test tasty-net-p2p alone
        run: cargo test -p tasty-net-p2p --locked
      # Criterion D1: the rendezvous server and two p2p_peer example processes punch,
      # connect and echo over loopback (docs/design/testing.md).
      - name: p2p example pair
        run: scripts/check.sh p2p-example-pair
      # The binding generation check (docs/design/mobile.md, rlib link contract): a
      # test cdylib carries tasty-net-ffi as an rlib next to its own export, and the
      # pinned generator makes Kotlin and Swift from that one library. One OS is
      # enough: the generated code does not depend on the host.
      - name: ffi bindgen (Linux)
        if: runner.os == 'Linux'
        run: scripts/check.sh ffi-bindgen

  repo-checks:
    name: shellcheck, no-tasty-deps, p2p-isolation, no-hidden-constants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      # Uses the shellcheck already on the runner, or installs the version pinned in
      # scripts/install-shellcheck.sh into the job's temporary folder.
      - name: Install shellcheck
        run: |
          PREFIX="$RUNNER_TEMP/bin" bash scripts/install-shellcheck.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: shellcheck
        run: scripts/check.sh shell
      # Criterion D7 of docs/design/done-criteria.md.
      - name: no-tasty-deps
        run: scripts/check.sh no-tasty-deps
      # Criterion D8 of docs/design/done-criteria.md.
      - name: p2p-isolation
        run: scripts/check.sh p2p-isolation
      # Criterion D10 of docs/design/done-criteria.md.
      - name: no-hidden-constants
        run: scripts/check.sh no-hidden-constants

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
      # The sum published next to the release archive (<file>.sha256).
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/cargo-deny"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir"
          echo "$dir/$name" >> "$GITHUB_PATH"
      - name: cargo deny
        run: scripts/check.sh deny

  # The security advisories of the locked dependencies (docs/design/ssh-backends.md
  # "의존 사실": russh, ssh-key and the rest follow security fixes). A new advisory can
  # fail it without a new commit; the fix is a version bump.
  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_AUDIT_VERSION: 0.23.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: cargo audit
        run: cargo audit

  # Mobile cross check (docs/design/mobile.md "모바일 cross check"): cargo check of the
  # crate and feature combinations in scripts/mobile-crates.list for each mobile target,
  # with the dependency check on the same arguments. MOBILE_CHECK_REQUIRE makes a target
  # without its std, NDK or Xcode SDK a failure instead of a skip.
  mobile-android:
    name: mobile cross check (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOBILE_CHECK_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      # The NDK version and archive sums pinned in scripts/install-ndk.sh
      # (docs/dev-guide/ci.md). The runner image has its own NDK, which this replaces.
      - name: install-ndk self-test
        run: bash scripts/install-ndk.sh --self-test
      - name: Install Android NDK
        run: |
          ndk=$(PREFIX="$RUNNER_TEMP/ndk" bash scripts/install-ndk.sh | tail -n 1)
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: no-process-spawn
        run: scripts/check.sh no-process-spawn
      - name: mobile-check aarch64-linux-android
        run: scripts/check.sh mobile-check aarch64-linux-android
      - name: mobile-check x86_64-linux-android
        run: scripts/check.sh mobile-check x86_64-linux-android

  mobile-ios:
    name: mobile cross check (iOS)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MOBILE_CHECK_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: bash scripts/install-toolchain.sh
      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: mobile-check aarch64-apple-ios
        run: scripts/check.sh mobile-check aarch64-apple-ios
      - name: mobile-check aarch64-apple-ios-sim
        run: scripts/check.sh mobile-check aarch64-apple-ios-sim
