name: relay

# Start check of the relay config examples (relay/punch-only.toml and
# relay/relay-fallback.toml) with the pinned iroh-relay image: criterion D5 (a)
# of docs/design/done-criteria.md. It runs on every push, not only on changes
# under relay/, so that each develop commit has a run to cite. The job is in
# docs/dev-guide/ci.md.

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

permissions:
  contents: read

# Same grouping as ci.yml: one group per branch and commit for pushes and
# manual runs, one group per pull request with older runs cancelled.
concurrency:
  group: relay-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  relay-config-check:
    name: relay-config-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Starts each config with --dev and checks HTTP, metrics, and the receive
      # limit in the start log. Prints one "relay-check config=<name> result=..."
      # line per config.
      - name: relay config check
        run: bash relay/check-config.sh
