# tasty-rendezvous 설정 예시. 안내: rendezvous/README.md.
# 키와 기본값의 정본은 docs/design/rendezvous.md "서버 설정값"이다.
# 기본값과 같은 값은 주석으로만 적는다. 값과 출처는 다음 명령으로 본다.
#
#   tasty-rendezvous settings --config rendezvous.toml
#
# 시간은 단위를 붙인 글자("5 s", "100 ms"), 없는 값은 "none"이다.
# 상대 경로는 이 파일이 있는 폴더를 기준으로 한다.

# 서버 키 폴더. tasty-rendezvous keygen --dir <이 폴더>로 만든다.
# compose.yaml은 이 경로에 볼륨을 붙인다.
key_dir = "/var/lib/tasty-rendezvous"

[listen]
# 주 포트: QUIC 조정 연결과 STUN. 로컬 IP가 여럿인 호스트는 특정 IP로 둔다.
# primary = "0.0.0.0:3478"
# 보조 포트: STUN만 받는다(NAT 판별).
# alternate_port = 3479
# 두 번째 IP. 주는 경우 그 IP의 주 포트와 보조 포트도 STUN만 받는다.
# alternate_ip = "none"

[advertise]
# 기기에게 알릴 공인 주소. 주 주소를 wildcard로 들을 때(컨테이너 포함) 반드시 준다.
# 203.0.113.10은 문서용 주소다. 자기 서버의 공인 IP로 바꾼다.
primary_ip = "203.0.113.10"
# 보조 포트를 다른 바깥 포트로 게시할 때만 준다.
# alternate_port = 3479
# 두 번째 IP를 알릴 주소. 두 번째 IP는 listen.alternate_ip로 듣는다(호스트에서 직접, 또는 컨테이너의
# host 네트워크. README "두 번째 IP"). 그 IP가 바깥 주소와 다를 때(NAT 뒤 호스트)만 여기에 바깥 주소를 준다.
# alternate_ip = "none"

# 접근 정책. 기본은 모든 기기를 받는다.
# [access]
# policy = "everyone"
#
# 정해 둔 기기만 받으려면 위 대신 아래를 쓴다. 목록 파일은 기기 ID(소문자 hex 64자)를
# 한 줄에 하나씩 적고, #으로 시작하는 줄과 빈 줄은 건너뛴다.
# [access]
# policy = "allowlist"
# file = "allowlist.txt"
