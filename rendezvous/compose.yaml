# tasty-rendezvous 운영 예시(Docker Compose). 안내: rendezvous/README.md.
#
#   docker compose -f rendezvous/compose.yaml build
#   docker compose -f rendezvous/compose.yaml run --rm rendezvous keygen --dir /var/lib/tasty-rendezvous
#   docker compose -f rendezvous/compose.yaml up -d
#
# 먼저 rendezvous.toml의 advertise.primary_ip를 이 호스트의 공인 IP로 고친다. 컨테이너 안에서는
# 듣는 주소가 컨테이너 주소라 advertise.*가 없으면 기기에게 알릴 주소가 없다.
services:
  rendezvous:
    # 이 레포 소스로 빌드한 이미지. 외부 서버 이미지는 쓰지 않는다.
    build:
      context: ..
      dockerfile: rendezvous/Dockerfile
    image: tasty-rendezvous:local
    restart: unless-stopped
    environment:
      # info는 기기 ID와 사건만 찍는다. debug는 IP와 후보 주소까지 찍는다.
      TASTY_RENDEZVOUS_LOG: "info"
    volumes:
      - ./rendezvous.toml:/etc/tasty-rendezvous/rendezvous.toml:ro
      # 설정의 allowlist를 쓰면 목록 파일도 설정 폴더에 읽기 전용으로 붙인다(file = "allowlist.txt").
      # 컨테이너 사용자 UID 10001이 읽을 수 있어야 한다(README "접속할 기기 정하기").
      # - ./allowlist.txt:/etc/tasty-rendezvous/allowlist.txt:ro
      # 서버 키(설정의 key_dir). 지우면 공개키가 바뀌어 기기 설정을 모두 고쳐야 한다.
      - rendezvous-key:/var/lib/tasty-rendezvous
    ports:
      # 주 포트: QUIC 조정 연결과 STUN. 보조 포트: STUN(NAT 판별).
      # 바깥 포트를 다르게 게시하면 보조 포트는 advertise.alternate_port에 그 바깥 포트를 적는다.
      # 브리지 네트워크는 IP 하나 구성만 된다. 두 번째 IP를 쓰면 ports를 지우고 network_mode: host로
      # 띄운다(Linux Docker Engine. README "두 번째 IP"). 브리지 컨테이너 안에는 호스트 IP가 없다.
      - "3478:3478/udp"
      - "3479:3479/udp"

volumes:
  rendezvous-key:
