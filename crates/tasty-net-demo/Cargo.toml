[package]
name = "tasty-net-demo"
description = "Example binaries and two-process integration tests of the Tasty network library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "demo-server"
path = "src/bin/demo-server.rs"

[[bin]]
name = "demo-dialer"
path = "src/bin/demo-dialer.rs"

[[bin]]
name = "p2p-link"
path = "src/bin/p2p-link.rs"

[dependencies]
serde_json = "1"
# The SHA-256 of the bulk bytes p2p-link sends and reads back.
sha2 = { version = "0.11", default-features = false }
tasty-net-frame = { path = "../tasty-net-frame" }
tasty-net-identity = { path = "../tasty-net-identity" }
tasty-net-p2p = { path = "../tasty-net-p2p" }
tasty-net-ssh = { path = "../tasty-net-ssh" }
tasty-net-transport = { path = "../tasty-net-transport" }

[dev-dependencies]
# The test-only SSH server, the fallback when OpenSSH sshd cannot serve
# (docs/design/testing.md "SSH 통합 시험의 sshd"). ring instead of the default aws-lc-rs.
russh = { version = "0.65", default-features = false, features = ["ring"] }
# The rendezvous server the P2P tests start in their own process on a loopback port
# (docs/design/testing.md "P2P 시험").
tasty-net-rendezvous = { path = "../tasty-net-rendezvous" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
