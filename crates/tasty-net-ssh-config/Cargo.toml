[package]
name = "tasty-net-ssh-config"
description = "OpenSSH ssh_config parsing ported from OpenSSH portable 10.6p2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate's own code is under the workspace license terms through BSD-2-Clause; the files
# derived from OpenSSH keep their notices (BSD-2-Clause, BSD-3-Clause, ISC, SSH-short), see
# LICENSE-OpenSSH.
license = "BSD-2-Clause AND BSD-3-Clause AND ISC AND SSH-short"
repository.workspace = true
publish = false

[dependencies]
# %C of ssh.c (the SHA-1 of the connection fields). No default features: only the hash.
sha1 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
