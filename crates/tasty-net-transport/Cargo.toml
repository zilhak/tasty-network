[package]
name = "tasty-net-transport"
description = "Transport abstraction, logical channels, handshake v2, roles and the SSH transport of the Tasty network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The SSH backend feature contract (docs/design/ssh-backends.md "feature 계약"). ssh is internal:
# it brings tasty-net-ssh without a backend, so consumers turn on a backend feature instead.
# Without default features the crate has no SSH transport.
default = ["system-ssh"]
ssh = ["dep:tasty-net-ssh"]
system-ssh = ["ssh", "tasty-net-ssh/system-ssh"]

[dependencies]
tasty-net-frame = { path = "../tasty-net-frame" }
tasty-net-identity = { path = "../tasty-net-identity" }
# The P2P adapter's connections and streams, and the QUIC close codes (docs/design/crates.md
# "의존 방향": transport ─> p2p).
tasty-net-p2p = { path = "../tasty-net-p2p" }
tasty-net-ssh = { path = "../tasty-net-ssh", default-features = false, optional = true }
# Nonces and bulk credentials (docs/design/crates.md "외부 의존 원칙").
getrandom = "0.4"
serde_json = "1"
# The hash of the signed handshake transcript (docs/design/handshake.md).
sha2 = { version = "0.11", default-features = false }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# Cancels a socket read blocked in another thread (docs/design/transport.md "시도 취소, 닫기, 회수").
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO"] }

[lints]
workspace = true
