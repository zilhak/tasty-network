[package]
name = "tasty-net-ssh"
description = "System ssh delegation of the Tasty network: -L tunnels, remote port discovery, cancellation, and backoff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The SSH backend feature contract (docs/design/ssh-backends.md "feature 계약"). system-ssh is
# the system ssh backend in src/system/; a build without any backend stops with compile_error!.
default = ["system-ssh"]
system-ssh = []

[dependencies]
tracing = "0.1"

[lints]
workspace = true
